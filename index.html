<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh;
            background-color: #fff0f5; font-family: 'Helvetica Neue', sans-serif; 
            text-align: center; overflow: hidden; position: relative;
            transition: background-color 1s ease;
        }

        .heart { position: absolute; color: rgba(255, 105, 180, 0.3); font-size: 24px; z-index: -1; }

        h1 { color: #d10056; margin-bottom: 100px; padding: 0 20px; transition: 1s ease; font-weight: 700; z-index: 2; }

        .celebration-text { color: #fff0f5; }
        
        .button-container { display: flex; flex-direction: column; align-items: center; gap: 40px; }

        .btn {
            padding: 20px 45px; font-size: 1.2rem; font-weight: bold;
            border: none; cursor: pointer; transition: all 0.2s ease-in-out;
            display: inline-flex; align-items: center; justify-content: center;
            clip-path: url(#squircle-path); -webkit-clip-path: url(#squircle-path);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        .btn-yes { 
            background-color: #ff4d4d; color: white; z-index: 10;
            filter: drop-shadow(0 0 15px rgba(255, 77, 77, 0.4));
        }

        .btn-no { background-color: white; color: #555; }
        .btn:active { transform: scale(0.9) !important; }

        .dancing-image {
            width: 150px; /* Adjust size as needed */
            height: auto;
            margin-bottom: 20px;
            display: none; /* Hidden until "Yes" is clicked */
            z-index: 2;
            transform-origin: bottom center;
            /* 123 BPM is roughly 0.48s per beat. 
            We use 0.97s for a full left-to-right swing cycle */
            animation: sway 0.97s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }
        
        @keyframes sway {
            0% { transform: rotate(-15deg); }
            50% { transform: rotate(15deg); }
            100% { transform: rotate(-15deg); }
        }

        /* Hide the music player */
        #music-player { display: none; }
    </style>
</head>
<body>

<audio id="music">
        <source src="pinkponyclub.mp3.mp3" type="audio/mpeg">
    </audio>

    
<svg width="0" height="0" style="position: absolute;">
  <defs>
    <clipPath id="squircle-path" clipPathUnits="objectBoundingBox">
      <path d="M 0.5,0 
               C 0.15,0 0,0.15 0,0.5 
               0,0.85 0.15,1 0.5,1 
               0.85,1 1,0.85 1,0.5 
               1,0.15 0.85,0 0.5,0 
               Z" />
    </clipPath>
  </defs>
</svg>

<!--
    <div class="heart" style="top:15%; left:10%;">❤️</div>
    <div class="heart" style="top:25%; left:85%;">💖</div>
    <div class="heart" style="top:75%; left:20%;">❤️</div>
-->
    
    <h1 id="question">Honey, will you be my valentine?</h1>

    <div class="button-container">
        <button id="yesBtn" class="btn btn-yes" onclick="celebrate()">Yes</button>
        <button id="noBtn" class="btn btn-no" onclick="handleNo()">No</button>
    </div>

    <img id="danceImg" src="IMG_4536.png" class="dancing-image" alt="Dancing Icon">
    
  <div id="player"></div>

<script>
    let yesSize = 1;
    let noClicks = 0;
    const noTexts = ["Are you sure?", "Really??", "Why not?!", "Pwease?", "Honey...", "It's not funny anymore", "Click Yes!"];

    const audio = document.getElementById('music');
    const question = document.getElementById('question');
    
    function handleNo() {
        yesSize += 0.3;
        document.getElementById('yesBtn').style.transform = `scale(${yesSize})`;

        audio.play();
        
        audio.pause();
        
        if (noClicks < noTexts.length) {
            document.getElementById('noBtn').innerText = noTexts[noClicks];
        }
        noClicks++;
    }

function celebrate() {
    question.innerText = "YAY! Pink Pony Club time!";
    question.classList.add('celebration-text');
    document.querySelector('.button-container').style.display = "none";
    document.body.style.backgroundColor = "#ff69b4";

    // Play the audio instantly
    audio.currentTime = 0;
    
    audio.play();

    // Show the dancing image
    const img = document.getElementById('danceImg');
    img.style.display = "block";

    for(let i=0; i<5140; i++) {
        setTimeout(createHeart, i * 50);
    }
}


    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        let heartStyle = Math.floor(Math.random() * 7);
        switch(heartStyle) {
            case 0:
                heart.innerText = '❤️';
                break;
            case 1:
                heart.innerText = '💖';
                break;
            case 2:
                heart.innerText = '💝';
                break;
            case 3:
                heart.innerText = '💕';
                break;
            case 4:
                heart.innerText = '💗';
                break;
            case 5:
                heart.innerText = '💞';
                break;
            case 6:
                heart.innerText = '💘';
                break;
        }
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.top = Math.random() * 100 + 'vh';
        heart.style.position = 'fixed';
        heart.style.zIndex = "1";
        document.body.appendChild(heart);
    }
</script>


</body>
</html>

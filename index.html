<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #fff0f5; /* Soft pink background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Background */
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.3);
            font-size: 24px;
            user-select: none;
            z-index: -1;
        }

        h1 {
            color: #d10056;
            font-size: 2rem;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        /* Bubble Button Style */
        .btn {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px; /* This creates the bubble shape */
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Yes Button - Highlighted Red */
        .btn-yes {
            background-color: #ff4d4d;
            color: white;
        }

        /* No Button - Simple White Bubble */
        .btn-no {
            background-color: white;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="heart" style="top:10%; left:10%;">❤️</div>
    <div class="heart" style="top:20%; left:80%;">💖</div>
    <div class="heart" style="top:70%; left:15%;">❤️</div>
    <div class="heart" style="top:85%; left:75%;">💕</div>
    <div class="heart" style="top:50%; left:50%;">💗</div>

    <h1>Honey, will you be my valentine?</h1>

    <div class="button-container">
        <button class="btn btn-yes" onclick="alert('Yay! ❤️ I love you!')">Yes</button>
        <button class="btn btn-no" onclick="alert('Try again? 🥺')">No</button>
    </div>

</body>
</html>

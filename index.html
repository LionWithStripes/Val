<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh;
            background-color: #fff0f5; font-family: sans-serif; text-align: center;
            overflow: hidden; position: relative;
        }

        .heart { position: absolute; color: rgba(255, 105, 180, 0.3); font-size: 24px; z-index: -1; }

        h1 { color: #d10056; margin-bottom: 30px; padding: 0 20px; transition: 0.3s; }

        .button-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }

        .btn {
            padding: 15px 35px; font-size: 1.2rem; font-weight: bold;
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); transition: all 0.2s;
        }

        .btn-yes { background-color: #ff4d4d; color: white; z-index: 10; }
        .btn-no { background-color: white; color: #555; }
    </style>
</head>
<body>

    <div class="heart" style="top:10%; left:10%;">❤️</div>
    <div class="heart" style="top:20%; left:80%;">💖</div>
    <div class="heart" style="top:70%; left:15%;">❤️</div>

    <h1 id="question">Honey, will you be my valentine?</h1>

    <div class="button-container">
        <button id="yesBtn" class="btn btn-yes" onclick="celebrate()">Yes</button>
        <button id="noBtn" class="btn btn-no" onclick="handleNo()">No</button>
    </div>

    <script>
        let yesSize = 1;
        let noClicks = 0;
        const noTexts = ["Are you sure?", "Really??", "Pwease?", "Don't do this...", "I'm gonna cry...", "Click the red one!"];

        function handleNo() {
            noClicks++;
            
            // 1. Make the Yes button grow
            yesSize += 0.4;
            document.getElementById('yesBtn').style.transform = `scale(${yesSize})`;
            
            // 2. Make the No button smaller
            let noScale = Math.max(0.5, 1 - (noClicks * 0.1));
            document.getElementById('noBtn').style.transform = `scale(${noScale})`;

            // 3. Change the text of the No button
            if (noClicks < noTexts.length) {
                document.getElementById('noBtn').innerText = noTexts[noClicks - 1];
            } else {
                document.getElementById('noBtn').innerText = "Fine, you win... not!";
            }
        }

        function celebrate() {
            document.getElementById('question').innerText = "YAY! See you on the 14th! ❤️";
            document.querySelector('.button-container').style.display = "none";
            document.body.style.backgroundColor = "#ffb6c1";
        }
    </script>
</body>
</html>
